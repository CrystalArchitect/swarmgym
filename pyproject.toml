[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmgym"
version = "0.1.0"
description = "On-chain safety auditor for multi-agent AI systems"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "web3>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
